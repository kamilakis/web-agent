<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agent">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Agent</title>
<link rel="icon" href="/media/site/favicon.ico?v=2" sizes="32x32">
<link rel="icon" href="/media/site/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/media/site/apple-touch-icon.png?v=2">
<link rel="mask-icon" href="/media/site/favicon.svg?v=2" color="#c96442">
<style>
:root {
  color-scheme: light dark;
  --bg:#faf9f5;          /* warm cream */
  --elev:#ffffff;
  --surface:#f0eee6;     /* user bubble, pills */
  --border:#e3e0d7;
  --text:#1a1a18;
  --dim:#6f6e69;
  --accent:#c96442;      /* terracotta */
  --accent-ink:#ffffff;
  --ok:#5b8a54;
  --danger:#bc4c3c;
  --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1f1e1d;
    --elev:#262624;
    --surface:#30302e;
    --border:#3b3a37;
    --text:#f5f4ef;
    --dim:#a5a29b;
    --accent:#d97757;
    --accent-ink:#1f1e1d;
    --ok:#7fb069;
    --danger:#e0705c;
  }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* .iconBtn sets display:grid, which would otherwise beat [hidden] */
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; }
html, body { height:100%; margin:0; }
body {
  background:var(--bg); color:var(--text);
  font:15.5px/1.5 var(--sans);
  height:100dvh;
}

/* ---------- sessions sidebar ---------- */
#app { display:flex; height:100dvh; }
#content { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
#sidebar {
  flex:0 0 35vw; min-width:220px; max-width:420px;   /* ~1/3 of the window */
  display:flex; flex-direction:column;
  background:var(--surface); border-right:1px solid var(--border);
}
.sb-head {
  padding:calc(env(safe-area-inset-top) + 12px) 12px 10px;
  display:flex; flex-direction:column; gap:8px;
  border-bottom:1px solid var(--border);
}
.sb-title { font-size:11px; font-weight:650; letter-spacing:.07em; text-transform:uppercase; color:var(--dim); }
.sb-actions { display:flex; gap:6px; }
.sb-btn {
  flex:1 1 auto; padding:7px 8px; cursor:pointer;
  background:var(--elev); color:var(--text);
  border:1px solid var(--border); border-radius:9px;
  font:600 12px/1 var(--sans);
}
.sb-btn:hover { border-color:var(--accent); color:var(--accent); }
.sb-btn:active { transform:scale(.97); }
.sb-btn:disabled { opacity:.45; cursor:default; }
.sb-note { font-size:12px; color:var(--danger); line-height:1.4; }
.sb-list { flex:1 1 auto; overflow-y:auto; padding:4px 6px calc(12px + env(safe-area-inset-bottom)); }
.sb-group { font-size:10.5px; font-weight:650; color:var(--dim); letter-spacing:.06em; text-transform:uppercase; padding:11px 8px 4px; }
.sb-item {
  display:flex; flex-direction:column; gap:3px; width:100%;
  background:none; border:0; border-radius:10px; padding:8px 9px;
  text-align:left; cursor:pointer; color:var(--text);
  font:13px/1.35 var(--sans);
}
.sb-item:hover { background:var(--elev); }
.sb-item.active { background:var(--elev); box-shadow:inset 0 0 0 1px var(--accent); }
.sb-item.viewing { box-shadow:inset 0 0 0 1.5px var(--accent); }
.sb-item .t { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-item .m { display:flex; gap:7px; font:10.5px/1.3 var(--mono); color:var(--dim); white-space:nowrap; overflow:hidden; }
.sb-item .m .badge { color:var(--ok); font-weight:700; }
.sb-toggle {
  display:none; width:30px; height:30px; padding:0;
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:8px;
  font-size:13px; cursor:pointer; place-items:center;
}
#banner {
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:8px 14px; background:var(--surface);
  border-bottom:1px solid var(--border); font-size:13px;
}
#banner #bannerTitle {
  flex:1 1 auto; min-width:0; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#banner #bannerBack {
  flex:0 0 auto; cursor:pointer;
  background:var(--elev); color:var(--accent);
  border:1px solid var(--border); border-radius:999px;
  padding:5px 12px; font:600 12px/1 var(--sans);
}
#banner #bannerResume {
  flex:0 0 auto; cursor:pointer;
  background:var(--accent); color:var(--accent-ink);
  border:1px solid var(--border); border-radius:999px;
  padding:5px 12px; font:600 12px/1 var(--sans);
}
#banner #bannerResume:disabled { opacity:.55; cursor:default; }
#banner #bannerDelete {
  flex:0 0 auto; cursor:pointer;
  background:var(--elev); color:var(--danger);
  border:1px solid var(--border); border-radius:999px;
  padding:5px 12px; font:600 12px/1 var(--sans);
}
#banner #bannerDelete:disabled { opacity:.55; cursor:default; }
#sbScrim { position:fixed; inset:0; z-index:35; background:rgba(0,0,0,.35); }
@media (min-width:901px) { #sbScrim { display:none !important; } }
@media (max-width:900px) {
  .sb-toggle { display:grid; }
  #sidebar {
    position:fixed; top:0; bottom:0; left:0; z-index:40;
    width:min(80vw, 320px); transform:translateX(-103%);
    transition:transform .18s ease;
  }
  body.sb-open #sidebar { transform:none; box-shadow:0 0 48px rgba(0,0,0,.45); }
}

/* ---------- header ---------- */
header {
  flex:0 0 auto; position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:9px;
  padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;
  background:var(--bg); border-bottom:1px solid var(--border);
}
header .mark { flex:0 0 auto; width:17px; height:17px; display:block; }
header .names { display:flex; flex-direction:column; min-width:0; line-height:1.15; }
header .title { font-size:15px; font-weight:600; letter-spacing:-.01em; }
header .session {
  font-size:11px; color:var(--dim); font-family:var(--mono);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.session-row { display:flex; align-items:center; gap:4px; min-width:0; }
.session-row .session { min-width:0; }
header .rename {
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:18px; height:18px; padding:0; border:0; border-radius:4px;
  background:transparent; color:var(--dim); cursor:pointer; opacity:.55;
}
header .rename:hover { opacity:1; background:rgba(128,128,128,.18); }
header .rename svg { width:11px; height:11px; }
header .build {
  flex:0 0 auto; cursor:pointer;
  background:none; border:0; padding:2px 0; margin:0;
  color:var(--dim); font:500 10px/1 var(--mono);
  opacity:.7; white-space:nowrap;
}
header .build:active { opacity:1; }
/* On a phone the header is already toggle + mark + name + status + model, so
   the commit step is desktop-only (it is in the tap toast either way). */
@media (max-width:560px) { header .build .commit { display:none; } }
header .spacer { flex:1 1 auto; }
.status { display:flex; align-items:center; gap:5px; flex:0 0 auto; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--dim); flex:0 0 auto; }
.dot.idle { background:var(--ok); }
.dot.busy { background:var(--accent); animation:pulse .9s ease-in-out infinite alternate; }
.dot.warn { background:var(--danger); }
@keyframes pulse { from { opacity:.35; transform:scale(.85); } to { opacity:1; transform:scale(1); } }
#statusText { font-size:12px; color:var(--dim); white-space:nowrap; }
#modelSel {
  flex:0 1 auto; min-width:0; max-width:132px;
  appearance:none; -webkit-appearance:none;
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:999px;
  padding:5px 22px 5px 11px; font:500 12px/1 var(--sans);
  text-overflow:ellipsis;
  background-image:linear-gradient(45deg, transparent 50%, var(--dim) 50%),
                   linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position:calc(100% - 12px) 52%, calc(100% - 8px) 52%;
  background-size:4px 4px, 4px 4px; background-repeat:no-repeat;
}

/* ---------- transcript ---------- */
main {
  flex:1 1 auto; overflow-y:auto; overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  display:flex; flex-direction:column;
  padding:18px 16px 10px;
}
.msg { display:flex; flex-direction:column; margin:0 0 20px; }
.msg.user {
  flex-direction:row; justify-content:flex-end;
  align-items:flex-start; gap:7px;
}
/* copy button beside the person's prompt, same pattern as code blocks */
.msg.user .pcopy {
  flex:0 0 auto; width:26px; height:26px; padding:0; margin-top:2px;
  display:flex; align-items:center; justify-content:center;
  background:var(--elev); color:var(--dim);
  border:1px solid var(--border); border-radius:7px; cursor:pointer;
  opacity:0; transition:opacity .12s, color .12s, border-color .12s;
}
.msg.user:hover .pcopy, .msg.user .pcopy:focus-visible { opacity:1; }
.msg.user .pcopy:hover { color:var(--accent); border-color:var(--accent); }
.msg.user .pcopy.done { opacity:1; color:var(--ok); border-color:var(--ok); }
.msg.user .pcopy svg { width:14px; height:14px; display:block; }
.msg.user .pcopy .ico-done { display:none; }
.msg.user .pcopy.done .ico-copy { display:none; }
.msg.user .pcopy.done .ico-done { display:block; }
@media (hover:none) { .msg.user .pcopy { opacity:1; } }   /* no hover on touch */
/* copy-whole-response: bottom-left of the final assistant reply */
.whole-copy {
  align-self:flex-start; margin-top:2px;
  display:inline-flex; align-items:center; gap:5px;
  background:none; border:0; padding:3px 7px; border-radius:7px;
  color:var(--dim); font:12px/1 var(--sans); cursor:pointer;
}
.whole-copy:hover { color:var(--accent); background:var(--surface); }
.whole-copy.done { color:var(--ok); }
.whole-copy svg { width:13px; height:13px; display:block; }
.msg.assistant { align-items:stretch; }
.bubble { white-space:pre-wrap; overflow-wrap:anywhere; }
/* the person's turn is a bubble; Claude's turn is plain prose, as in the app */
.msg.user .bubble {
  max-width:86%; padding:10px 14px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:19px; border-bottom-right-radius:6px;
}
.msg.assistant .bubble { line-height:1.62; }
/* §17: a terminal run error (provider failure, broken pi bundle) is a first-class
   transcript item, not a silent empty reply — it must survive a snapshot reload. */
.msg.assistant .bubble.err {
  border-left:2px solid var(--danger); background:var(--surface);
  border-radius:8px; padding:9px 12px; line-height:1.45;
}
.bubble.err .errHead { font-weight:650; color:var(--danger); margin-bottom:4px; }
.bubble.err .errBody {
  font-family:var(--mono); font-size:12px;
  white-space:pre-wrap; overflow-wrap:anywhere;
}
.bubble code {
  font-family:var(--mono); font-size:.88em;
  background:var(--surface); border-radius:5px; padding:1px 5px;
}
.bubble pre {
  font-family:var(--mono); font-size:12px; line-height:1.5;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 12px; margin:10px 0; overflow-x:auto; white-space:pre;
}
.bubble pre code { background:none; padding:0; font-size:inherit; }
/* Code blocks get a copy button pinned to the top-right. Buttons are part of
   the generated markup and a single delegated listener handles the clicks, so
   nothing has to be re-bound as the reply streams and the bubble re-renders. */
.codeblock { position:relative; }
.codeblock pre { padding-right:44px; }
.codeblock .copy {
  position:absolute; top:6px; right:6px;
  display:flex; align-items:center; justify-content:center;
  width:26px; height:26px; padding:0;
  background:var(--elev); color:var(--dim);
  border:1px solid var(--border); border-radius:7px; cursor:pointer;
  opacity:0; transition:opacity .12s, color .12s, border-color .12s;
}
.codeblock:hover .copy, .codeblock .copy:focus-visible { opacity:1; }
.codeblock .copy:hover { color:var(--accent); border-color:var(--accent); }
.codeblock .copy.done { opacity:1; color:var(--ok); border-color:var(--ok); }
.codeblock .copy svg { width:14px; height:14px; display:block; }
.codeblock .copy .ico-done { display:none; }
.codeblock .copy.done .ico-copy { display:none; }
.codeblock .copy.done .ico-done { display:block; }
@media (hover:none) { .codeblock .copy { opacity:1; } }   /* no hover on touch */
.bubble .h { display:block; font-weight:650; margin:14px 0 3px; }
.bubble .h:first-child { margin-top:0; }
.bubble a { color:var(--accent); }
.msg.assistant .bubble + .bubble { margin-top:12px; }
.msg.assistant .atts { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.msg.assistant .atts img.att {
  max-width:220px; max-height:220px; border-radius:12px;
  border:1px solid var(--border); display:block; object-fit:cover;
}
/* §16 interactive choices */
.choose { margin-top:10px; display:flex; flex-direction:column; gap:7px; }
.chooseQ { font-size:13px; color:var(--dim); }
.chooseBtn {
  text-align:left; background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:12px;
  padding:9px 13px; font:14px/1.4 var(--sans); cursor:pointer;
}
.chooseBtn:active { border-color:var(--accent); color:var(--accent); }
.chooseDone { font-size:13px; color:var(--accent); }
.bubble.streaming::after {
  content:""; display:inline-block; width:7px; height:1.02em;
  margin-left:2px; vertical-align:-2px; background:var(--accent);
  animation:blink 1.05s steps(1, end) infinite;
}
@keyframes blink { 50% { opacity:0; } }

/* ---------- tool calls, Claude Code style (§8 tool rows) ---------- */
details.tool { width:100%; margin:6px 0 8px; font-family:var(--mono); font-size:12.5px; }
/* §8 L5: parallel calls are siblings in one message — keep the stack tight */
details.tool + details.tool { margin-top:2px; }
details.tool summary {
  display:flex; align-items:center; gap:7px;
  list-style:none; cursor:pointer; user-select:none;
  padding:1px 0; color:var(--dim);
}
details.tool summary::-webkit-details-marker { display:none; }
/* §8 L4: a real CSS circle (the shared .dot), never "⏺" — iOS renders that
   as an emoji, and an emoji ignores `color`, so the dot stayed blue. */
details.tool .dot { background:var(--dim); }
details.tool.running .dot { background:var(--accent); animation:pulse .9s ease-in-out infinite alternate; }
details.tool.done .dot { background:var(--ok); animation:none; }
details.tool.error .dot { background:var(--danger); animation:none; }
details.tool .desc {
  flex:1 1 auto; min-width:0; color:var(--text); font-family:var(--sans);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
details.tool.error .desc { color:var(--danger); }
/* the tool name is a small dim tag on the right (§8.2) */
details.tool .name { flex:0 0 auto; color:var(--dim); font-size:11px; opacity:.75; }
details.tool .chev { flex:0 0 auto; font-size:10px; opacity:.5; transition:transform .15s; }
details.tool[open] .chev { transform:rotate(90deg); }
details.tool .out {
  margin:5px 0 0 4px; padding:2px 0 2px 13px;
  border-left:2px solid var(--border); color:var(--dim);
  white-space:pre-wrap; overflow-wrap:anywhere;
  font-size:12px; line-height:1.5;
  max-height:240px; overflow:auto;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
details.tool .out:empty { display:none; }
details.tool .sec { display:flex; gap:8px; }
details.tool .sec + .sec { margin-top:4px; }
details.tool .lbl { flex:0 0 auto; width:42px; color:var(--dim); opacity:.6; }
details.tool .body { flex:1 1 auto; min-width:0; }
.empty {
  margin:auto; padding:40px 24px; text-align:center;
  color:var(--dim); font-size:14px;
}

/* ---------- composer ---------- */
footer {
  flex:0 0 auto; background:var(--bg); border-top:1px solid var(--border);
  padding:9px 12px calc(10px + env(safe-area-inset-bottom));
}
#compose {
  display:flex; align-items:center; gap:7px;
  background:var(--elev); border:1px solid var(--border);
  border-radius:24px; padding:4px 4px 4px 15px;
  transition:border-color .15s;
}
#compose:focus-within { border-color:var(--accent); }
#input {
  flex:1 1 auto; min-width:0;
  background:none; border:0; outline:none; color:var(--text);
  font:16px/1.35 var(--sans); padding:9px 0;
}
#input::placeholder { color:var(--dim); }
.iconBtn {
  flex:0 0 auto; width:36px; height:36px; padding:0;
  border:0; border-radius:50%; display:grid; place-items:center;
  font-size:17px; line-height:1; transition:transform .1s, opacity .1s;
}
.iconBtn:active { transform:scale(.92); opacity:.85; }
#sendBtn { background:var(--accent); color:var(--accent-ink); font-weight:700; }
#stopBtn { background:var(--surface); color:var(--text); border:1px solid var(--border); font-size:12px; }
#attachBtn { color:var(--dim); }
#attachBtn svg { display:block; }
#preview { display:flex; align-items:center; gap:8px; padding:0 4px 9px; }
#preview img {
  height:56px; max-width:140px; object-fit:cover;
  border-radius:12px; border:1px solid var(--border);
}
#preview .rm {
  width:24px; height:24px; border-radius:50%; padding:0;
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); font-size:12px; line-height:1;
  display:grid; place-items:center;
}
.msg.user .bubble img.attach {
  display:block; margin-top:9px; max-width:70%; max-height:280px;
  border-radius:12px; border:1px solid var(--border); object-fit:cover;
}
.msg.user .bubble img.attach:first-child { margin-top:0; }
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
  <div class="sb-head">
    <div class="sb-title">Sessions</div>
    <div class="sb-actions">
      <button id="sbNew" class="sb-btn" type="button" title="Start a fresh session (this one stays in the list)">+ New session</button>
      <button id="sbArchive" class="sb-btn" type="button" title="Archive the running session and start a fresh one">Archive</button>
    </div>
    <div id="sbNote" class="sb-note" hidden></div>
  </div>
  <div id="sessList" class="sb-list"></div>
</aside>
<div id="content">
<header>
  <button id="sbToggle" class="sb-toggle" type="button" title="Sessions" aria-label="Sessions">☰</button>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
    <g stroke="var(--accent)" fill="none" stroke-width="2.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.6 5 L14 12 L3.6 19"/>
    </g>
    <rect x="16.6" y="16.9" width="6.3" height="2.4" rx="1.1" fill="var(--accent)"/>
  </svg>
  <div class="names">
    <div class="title">Agent</div>
    <div class="session-row">
      <div class="session" id="sessionName"></div>
      <button class="rename" id="renameBtn" title="rename this session" aria-label="rename this session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      </button>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="status"><span class="dot warn" id="statusDot"></span><span id="statusText">connecting…</span></div>
  <select id="modelSel" title="model" aria-label="model"></select>
  <button id="buildBadge" class="build" type="button" title="build"></button>
</header>
<div id="banner" hidden>
  <span id="bannerTitle"></span>
  <button id="bannerResume" type="button">▶ Resume</button>
  <button id="bannerDelete" type="button">Delete</button>
  <button id="bannerBack" type="button">← Return to live</button>
</div>
<main id="log"></main>
<footer id="foot">
  <div id="preview" hidden></div>
  <form id="compose" autocomplete="off">
    <button id="attachBtn" class="iconBtn" type="button" title="Attach photo" aria-label="Attach photo">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 8a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="9" cy="10" r="1.4" fill="currentColor"/>
        <path d="M5.5 17.5 10 13l3 3 2.5-2.5 3 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <input id="input" placeholder="Reply to Agent…" enterkeyhint="send">
    <button id="stopBtn" class="iconBtn" type="button" title="Stop" aria-label="Stop" hidden>■</button>
    <button id="sendBtn" class="iconBtn" type="submit" title="Send" aria-label="Send">↑</button>
  </form>
  <input id="fileInput" type="file" accept="image/*" hidden>
</footer>
</div><!-- /content -->
</div><!-- /app -->
<div id="sbScrim" hidden></div>
<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';
// Bump when the page changes meaningfully; logged to the console at load so a

// Copy buttons are generated into the markdown, so one delegated listener
// covers every block, including ones added while a reply is still streaming.
// navigator.clipboard is unavailable over plain http (not a secure context --
// this dashboard is http://<vpn-ip>:8383), so fall back to a selection copy.
logEl.addEventListener('click', async (e) => {
  // copy button beside a user prompt
  const pbtn = e.target.closest('.msg.user .pcopy');
  if (pbtn) {
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(pbtn._text || '');
        ok = true;
      }
    } catch {}
    if (!ok) ok = copyPlainText(pbtn._text);
    pbtn.classList.toggle('done', ok);
    pbtn.title = ok ? 'Copied' : 'Copy failed';
    if (ok) setTimeout(() => { pbtn.classList.remove('done'); pbtn.title = 'Copy prompt'; }, 1200);
    return;
  }
  const btn = e.target.closest('.codeblock .copy');
  if (!btn) return;
  const pre = btn.closest('.codeblock').querySelector('pre');
  if (!pre) return;
  const text = pre.textContent;
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch {}
  if (!ok) {
    const r = document.createRange();
    r.selectNodeContents(pre);
    const sel = getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    sel.removeAllRanges();
  }
  btn.classList.toggle('done', ok);
  btn.title = ok ? 'Copied' : 'Copy failed';
  if (ok) setTimeout(() => { btn.classList.remove('done'); btn.title = 'Copy'; }, 1200);
});

// Plain-text copy fallback (prompts aren't in the DOM to select): a hidden
// textarea, select, execCommand — the path iOS Safari takes over plain http.
function copyPlainText(text) {
  const ta = document.createElement('textarea');
  ta.value = text || '';
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

// "Copy" under a finished assistant reply: gathers every text bubble's
// markdown source (tool rows excluded, trailing choose fence stripped).
function addWholeCopy(msg) {
  if (!msg || msg.querySelector(':scope > .whole-copy')) return;
  const parts = () => [...msg.querySelectorAll(':scope > .bubble')]
    .map(b => b._raw || b.textContent || '').filter(s => s.trim());
  if (!parts().length) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'whole-copy';
  btn.title = 'Copy whole response';
  btn.innerHTML = copyIcons() + '<span>Copy</span>';
  btn.onclick = async () => {
    const text = parts().join('\n\n')
      .replace(/```choose[^\n]*\n[\s\S]*?```/gi, '').trim();
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch {}
    if (!ok) ok = copyPlainText(text);
    btn.classList.toggle('done', ok);
    const lbl = btn.querySelector('span');
    if (lbl) lbl.textContent = ok ? 'Copied' : 'Copy failed';
    if (ok) setTimeout(() => {
      btn.classList.remove('done');
      if (lbl) lbl.textContent = 'Copy';
    }, 1400);
  };
  msg.appendChild(btn);
}

async function loadSessions() {
  try {
    const r = await fetch('/sessions', {headers: H});
    if (r.status === 404) { sessions = undefined; renderSessions(); return; }
    const data = await r.json();
    sessions = data.sessions || [];
  } catch { sessions = null; }
  renderSessions();
}

function fmtDate(s) {
  const d = new Date(s.started || (s.mtime ? s.mtime * 1000 : NaN));
  if (isNaN(d)) return '';
  return d.toLocaleDateString(undefined, {month: 'short', day: 'numeric'})
       + ' ' + d.toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
}

function sessionItem(s) {
  const b = document.createElement('button');
  b.type = 'button';
  const sel = (viewing && viewing.file === s.name && viewing.dir === s.dir);
  b.className = 'sb-item' + (s.active ? ' active' : '') + (sel ? ' viewing' : '');
  b.appendChild(el('span', 't', s.title || s.name));
  const m = el('span', 'm');
  m.appendChild(el('span', '', fmtDate(s)));
  m.appendChild(el('span', '', (s.count || 0) + ' msgs'));
  if (s.active) m.appendChild(el('span', 'badge', 'live'));
  b.appendChild(m);
  b.onclick = () => s.active ? returnToLive() : openSession(s);
  return b;
}

function renderSessions() {
  sessList.innerHTML = '';
  if (sessions === undefined) {
    sessList.appendChild(el('div', 'sb-group', 'Sessions'));
    const n = el('button', 'sb-item');
    n.type = 'button';
    n.appendChild(el('span', 't', 'list unavailable — restart the daemon'));
    n.onclick = closeSb;
    sessList.appendChild(n);
    return;
  }
  if (!Array.isArray(sessions) || !sessions.length) return;
  const active = sessions.find(s => s.active);
  const prev = sessions.filter(s => !s.active && s.dir === 'sessions');
  // B5: an un-archived session is live now; without !s.active it would appear
  // under both Running and Archived.
  const arch = sessions.filter(s => s.dir === 'archive' && !s.active);
  if (active) {
    sessList.appendChild(el('div', 'sb-group', 'Running'));
    sessList.appendChild(sessionItem(active));
  }
  if (prev.length) {
    sessList.appendChild(el('div', 'sb-group', 'Previous'));
    prev.forEach(s => sessList.appendChild(sessionItem(s)));
  }
  if (arch.length) {
    sessList.appendChild(el('div', 'sb-group', 'Archived'));
    arch.forEach(s => sessList.appendChild(sessionItem(s)));
  }
}

async function openSession(s) {
  try {
    const r = await fetch('/session?file=' + encodeURIComponent(s.name)
                          + '&dir=' + s.dir, {headers: H});
    const data = await r.json();
    if (data.error) { sbMsg(data.error); return; }
    viewing = {file: s.name, dir: s.dir, title: s.title || s.name};
    bannerTitle.textContent = 'Viewing ' + viewing.title;
    banner.hidden = false;
    foot.hidden = true;
    renderSnapshot(data.messages || [], true);
    renderSessions();
    closeSb();
  } catch { sbMsg('could not load that session'); }
}

async function refreshLive() {
  try {

}

async function refreshHeader() {
  try {
    const st = await fetch('/state', {headers: H}).then(r => r.json());
    sessionName.textContent = st.sessionName || st.sessionId || '';
    // B2: a switch puts pi back on AGENT_MODEL (§2.4), so the dropdown has to

    applyModelToSelect(st.model);

// The build badge (top right). "Keep versioning" is only useful if the running
// pair is visible: the dashboard knows its own UI_VERSION from the file it was
// served, and /version reports the daemon's. They are bumped together, so a
// difference means the page is ahead of the daemon — e.g. a button whose
// endpoint 404s.
async function loadBuild() {
  try {
    buildInfo = await fetch('/version', {headers: H}).then(r => r.json());
  } catch {
    buildInfo = null;
  }
  renderBuildBadge();
}
function renderBuildBadge() {
  buildBadge.textContent = '';
  buildBadge.appendChild(el('span', 'ver', 'v' + UI_VERSION));
  if (buildInfo && buildInfo.commit) {
    buildBadge.appendChild(el('span', 'commit', ' · ' + buildInfo.commit));
  }
  const bits = ['dashboard ' + UI_VERSION];
  if (buildInfo && buildInfo.daemon) {
    bits.push('daemon ' + buildInfo.daemon +
              (buildInfo.commit ? ' (' + buildInfo.commit + ')' : ''));
    if (buildInfo.built) bits.push('installed ' + buildInfo.built);
    if (buildInfo.daemon !== UI_VERSION) {
      bits.push('\u26a0 dashboard and daemon differ \u2014 restart the daemon');
    }
  } else {
    // An older daemon has no /version at all: say so rather than imply a match.
    bits.push('daemon version unknown \u2014 restart the daemon');
  }
  buildBadge.title = bits.join(' · ');
}
buildBadge.onclick = () => sbMsg(buildBadge.title, 8000);

// Show `m` in the model dropdown, adding it if the list does not carry it
// (AGENT_MODEL can be a model /models does not offer).
function applyModelToSelect(m) {
  if (!m || !m.provider || !m.id) return;
  const key = m.provider + '|' + m.id;
  const opts = Array.from(modelSel.options || []);
  if (!opts.some(o => o.value === key)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = m.id;
    modelSel.appendChild(opt);
  }
  modelSel.value = key;
}

async function returnToLive() {
  viewing = null;
  banner.hidden = true;
  foot.hidden = false;
  renderSessions();
  await refreshLive();
}

// §4: the only way to resume — from the banner, so what is being resumed is on
// screen before the user commits. Sidebar clicks keep meaning "view".
async function resumeViewed() {
  if (!viewing) return;
  const v = viewing;
  let q = 'Resume "' + (v.title || v.file) + '"?\n' +
          'It becomes the live session for web, Siri and Matrix.';
  if (working) q += '\nThe running reply will be stopped.';
  if (v.dir === 'archive') q += '\nIt will move out of Archived.';
  if (!confirm(q)) return;
  bannerResume.disabled = true;
  try {
    const r = await fetch('/opensession', {
      method: 'POST',
      headers: {...H, 'Content-Type': 'application/json'},
      body: JSON.stringify({file: v.file, dir: v.dir}),
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 404) {   // no such endpoint on an old daemon
      sbMsg('resume needs a daemon restart');
      bannerResume.disabled = false;
      return;
    }
    if (data.error) {         // stay in view mode so the user can retry
      sbMsg(data.error);
      bannerResume.disabled = false;
      return;
    }
    viewing = null;
    banner.hidden = true;
    foot.hidden = false;
    mine = [];
    resetStream();
    setStatus(false);
    await loadSessions();
    await refreshHeader();    // B2: picks the model the switch left us on
    await refreshLive();
  } catch {
    sbMsg('could not resume that session');
  }
  bannerResume.disabled = false;
}

// §9: delete the transcript you are LOOKING at, so what gets removed is never
// a guess. The daemon refuses the live session, so this cannot delete the
// session the dashboard is attached to.
async function deleteViewed() {
  if (!viewing) return;
  const v = viewing;
  const meta = (Array.isArray(sessions) ? sessions : [])
                 .find(s => s.name === v.file && s.dir === v.dir) || {};
  const n = (meta.count != null) ? meta.count : '?';
  const when = meta.mtime ? new Date(meta.mtime * 1000).toLocaleString() : 'unknown date';
  if (!confirm('Delete "' + (v.title || v.file) + '" (' + n + ' msgs, ' + when + ')?\n' +
               'It moves to the trash and is purged after 30 days.')) return;
  bannerDelete.disabled = true;
  try {
    const r = await fetch('/deletesession', {
      method: 'POST',
      headers: {...H, 'Content-Type': 'application/json'},
      body: JSON.stringify({file: v.file, dir: v.dir}),
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 404) {   // no such endpoint on an old daemon
      sbMsg('delete needs a daemon restart');
      bannerDelete.disabled = false;
      return;
    }
    if (data.error) {
      sbMsg(data.error);
      bannerDelete.disabled = false;
      return;
    }
    await returnToLive();
    await loadSessions();
    sbMsg('Deleted');
  } catch {
    sbMsg('could not delete that session');
  }
  bannerDelete.disabled = false;
}

async function doSwitch(kind) {
  const busyNote = working ? '\nThe running reply will be stopped.' : '';
  const q = kind === 'archive'
    ? 'Archive this session and start a fresh one?' + busyNote
    : 'Start a new session? This one stays in the list.' + busyNote;
  if (!confirm(q)) return;
  const ans = prompt('Name the new session\n(blank = the default "' + (sessionName.textContent || 'siri-agent') + '"):', '');
  if (ans === null) return;   // cancelled
  const name = ans.trim().slice(0, 80);
  sbNew.disabled = sbArchive.disabled = true;
  try {
    const res = await fetch('/' + kind, {method: 'POST', headers: H,
      body: JSON.stringify(name ? {name} : {})}).then(r => r.json());
    if (res.error) sbMsg(res.error);
  } catch { sbMsg('switch failed — is the daemon up to date?'); }
  sbNew.disabled = sbArchive.disabled = false;
  await loadSessions();
  refreshHeader();
  if (!viewing) refreshLive();
}
sbNew.onclick = () => doSwitch('newsession');
sbArchive.onclick = () => doSwitch('archive');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function scrollBottom() { logEl.scrollTop = logEl.scrollHeight; }
function setStatus(state) {
  if (state === 'reconnecting…') {
    statusText.textContent = state; statusDot.className = 'dot warn'; return;
  }
  working = !!state;
  statusText.textContent = working ? 'working…' : '';
  statusDot.className = 'dot ' + (working ? 'busy' : 'idle');

  sendBtn.hidden = working;

function ensureMsg() {
  if (!curBubble) { curBubble = el('div', 'msg assistant'); logEl.appendChild(curBubble); }
  return curBubble;
}
function ensureTxt() {
  ensureMsg();
  if (!curTxt) { curTxt = el('div', 'bubble streaming'); curBubble.appendChild(curTxt); }
  return curTxt;
}

// §17: pi reports a failed turn as an assistant message with stopReason "error"
// and empty content. Rendering it (live and on snapshot reload) is what turns a
// silent no-op — the daemon used to log dur_s=0.0, answer_len=0 — into a visible
// failure.
function errorBubble(text) {
  const b = el('div', 'bubble err');
  b.appendChild(el('div', 'errHead', '⚠ agent error'));
  b.appendChild(el('div', 'errBody', String(text || 'unknown error')));
  return b;
}
// Just enough markdown for what the agent writes. Escapes first, so the
// transcript can never inject markup into the page.
function mdToHtml(src) {
  const blocks = [];
  let s = String(src).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  s = s.replace(/```([\s\S]*?)```/g, (m, code) => {
    blocks.push(code.replace(/^[A-Za-z0-9_+-]*\n/, '').replace(/\n$/, ''));
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  s = s.replace(/^[ \t]{0,3}#{1,4}[ \t]+(.+)\n?/gm, '<span class="h">$1</span>');
  s = s.replace(/\n{3,}/g, '\n\n');
  s = s.replace(/^(\s*)[-*]\s+/gm, '$1• ');
  s = s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0000(\d+)\u0000/g, (m, i) =>
                '<div class="codeblock"><pre><code>' + blocks[+i] +
                '</code></pre>' + copyBtnHtml() + '</div>');
  return s;
}
// Two icons; CSS swaps them so the tick costs no DOM churn on click.
function copyIcons() {
  return '<svg class="ico-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<rect x="9" y="9" width="13" height="13" rx="2"/>'
    + '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
    + '<svg class="ico-done" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
    + ' stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<path d="M20 6 9 17l-5-5"/></svg>';
}
function copyBtnHtml() {
  return '<button type="button" class="copy" title="Copy" aria-label="Copy code">'
    + copyIcons() + '</button>';
}
function appendDelta(delta) {
  const t = ensureTxt();
  t._raw = (t._raw || '') + delta;
  t.innerHTML = mdToHtml(t._raw);
}
function resetStream() { endCaret(); curBubble = null; curTxt = null; resetToolRows(); }

// ---- §16 interactive choices ----
// Parse the LAST closed ```choose fence out of an assistant reply and swap it
// for tappable option buttons. Returns {question, options} or null; `target`
// is only mutated after validation succeeds.
function applyChooseBlock(target, raw) {
  const re = /```choose[^\n]*\n([\s\S]*?)```/gi;
  let m, last = null;
  while ((m = re.exec(raw)) !== null) last = m;
  if (!last) return null;
  const lines = last[1].split('\n').map(s => s.trim()).filter(Boolean);
  const question = lines[0] || '';
  const options = lines.slice(1).filter(l => l.startsWith('- '))
                   .map(l => l.slice(2).trim()).filter(Boolean);
  if (!question || !options.length) return null;
  const cleaned = (raw.slice(0, last.index) + raw.slice(last.index + last[0].length)).trim();
  target.classList.remove('streaming');
  target.innerHTML = cleaned ? mdToHtml(cleaned) : '';
  const wrap = el('div', 'choose');
  wrap.appendChild(el('div', 'chooseQ', question));
  for (const opt of options) {
    const btn = document.createElement('button');
    btn.className = 'chooseBtn';
    btn.type = 'button';
    btn.textContent = opt;
    btn.onclick = () => chooseOption(wrap, opt);
    wrap.appendChild(btn);
  }
  target.appendChild(wrap);
  return { question, options };
}
function maybeApplyChoices() {
  if (curTxt && curTxt._raw) applyChooseBlock(curTxt, curTxt._raw);
}
// A tap IS the user's next message: the option text goes out verbatim and the
// buttons collapse to a chip so reconnect/snapshot re-renders stay consistent
// (the staleness rule in renderSnapshot would hide them anyway).
function chooseOption(wrap, opt) {
  wrap.innerHTML = '';
  wrap.appendChild(el('span', 'chooseDone', '→ ' + opt));
  mine.push(opt);
  appendUser(opt);
  fetch('/prompt', {
    method:'POST',
    headers:{...H, 'Content-Type':'application/json'},
    body: JSON.stringify({message: opt}),
  }).catch(() => setStatus('reconnecting…'));
}

// ---- §8.3 tool descriptions (pure) ----
// --- describeTool:start ---
// §8.3 Tier 1: a deterministic, client-side description for every tool call.
// Pure (no DOM) on purpose: tests/describeTool.test.js loads exactly this
// block and runs the table below against it. Keep new describers one line each.
function toolArgPreview(arg) {
  if (arg == null) return '';
  if (typeof arg === 'string') return arg.trim().split('\n')[0];
  if (typeof arg !== 'object') return String(arg);
  for (const k of ['command','file_path','path','pattern','query','url','content','name','id']) {
    if (typeof arg[k] === 'string') return arg[k].trim().split('\n')[0];
  }
  for (const v of Object.values(arg)) {
    if (typeof v === 'string' && v.trim()) return v.trim().split('\n')[0];
  }
  return '';
}
function toolStr(v) {
  if (v == null) return '';
  return typeof v === 'string' ? v.trim() : String(v);
}
function toolEllipsise(s, n) {
  s = String(s == null ? '' : s);
  n = n || 60;
  return s.length <= n ? s : s.slice(0, n - 1).trimEnd() + '…';
}
function toolBasename(p) {
  const s = toolStr(p).replace(/\/+$/, '');
  return s.split('/').pop() || s;
}
function toolQuoted(v) {
  const s = toolStr(v);
  return s ? '“' + s + '”' : '';
}
// "mcp__memos__search_memos" -> {server:"memos", tool:"search_memos"}, else null
function toolMcp(name) {
  const parts = String(name || '').split('__');
  if (parts.length < 3 || parts[0] !== 'mcp') return null;
  return {server: parts.slice(1, -1).join('__'), tool: parts[parts.length - 1]};
}
// Human words for a tool: the MCP tool name, or the plain name with _ -> space.
function toolWords(name) {
  const mcp = toolMcp(name);
  const w = (mcp ? mcp.tool : String(name || '')).replace(/_/g, ' ').trim();
  return w ? w.charAt(0).toUpperCase() + w.slice(1) : 'Tool';
}
// The right-hand dim tag: `bash`, `read`, `mcp memos`.
function toolTag(name) {
  const mcp = toolMcp(name);
  return mcp ? 'mcp ' + mcp.server : String(name || '');
}
function toolFirstString(a) {
  if (typeof a === 'string') return a.trim();
  if (!a || typeof a !== 'object') return '';
  for (const v of Object.values(a)) {
    if (typeof v === 'string' && v.trim()) return v.trim().split('\n')[0];
  }
  return '';
}
// `cd /x && ls -la | head` -> `ls -la`: drop a leading cd, keep the first command.
function toolShortCommand(cmd) {
  let s = toolStr(cmd);
  if (!s) return '';
  s = s.replace(/^cd\s+[^&|;\n]+&&\s*/, '');
  return s.split(/\n|&&|\|\||;|\|/)[0].trim();
}
function toolDescribeBash(a) {
  const d = toolStr(a.description);          // Tier 2 fills this in if it ever lands
  if (d) return toolEllipsise(d, 60);
  const cmd = toolShortCommand(a.command);
  return cmd ? 'Running ' + toolEllipsise(cmd, 60) : 'Running a command';
}
const TOOL_DESCRIBERS = {
  read:  a => 'Reading ' + toolBasename(a.file_path || a.path),
  write: a => 'Writing ' + toolBasename(a.file_path || a.path),
  edit:  a => 'Editing ' + toolBasename(a.file_path || a.path),
  grep:  a => 'Searching files for ' + toolQuoted(a.pattern),
  find:  a => 'Finding files named ' + toolQuoted(a.pattern),
  ls:    a => 'Listing ' + (toolStr(a.path || a.dir) || '.'),
  'mcp__memos__search_memos': a => 'Searching memos for ' + toolQuoted(a.query),
  'mcp__memos__get_memo': a => 'Opening memo ' +
    (toolStr(a.id) ? toolStr(a.id).slice(0, 8) + '…' : ''),
};
function describeTool(name, args) {
  const a = (args && typeof args === 'object') ? args : {};
  const n = String(name || '');
  if (n === 'bash') return toolDescribeBash(a);
  const fn = TOOL_DESCRIBERS[n];
  if (fn) return fn(a).trim();
  const mcp = toolMcp(n);
  const words = toolWords(n);
  if (mcp) {
    const arg = toolFirstString(a);
    return words + ' (' + mcp.server + ')' + (arg ? ': ' + toolEllipsise(arg, 40) : '');
  }
  const arg = toolArgPreview(a);
  return words + (arg ? ': ' + toolEllipsise(arg, 40) : '');
}
// Shown between toolcall_start and toolcall_end, while the args still stream.
function toolPreparing(name) { return 'Preparing ' + toolWords(name) + '…'; }
// --- describeTool:end ---

// ---- §8 tool rows: one row per tool call, keyed by toolCallId ----
// Live and reloaded views share this: a row is created by its call, filled by
// its execution, and looked up by id — never by "the last row I made".
// tests/toolRows.test.js evaluates exactly this block against a stub DOM.
// --- toolRows:start ---
const TOOL_RESULT_MAX = 2048;   // mirrors the daemon's AGENT_WEB_TOOL_CAP
let toolRows = new Map();       // toolCallId -> <details class="tool">
let unboundTools = [];          // rows whose toolcall_start carried no id yet
function toolRow(name, id) {
  const d = el('details', 'tool running');
  if (id) d.dataset.id = id;
  const s = el('summary');
  s.appendChild(el('span', 'dot'));
  s.appendChild(el('span', 'desc', toolPreparing(name)));
  s.appendChild(el('span', 'name', toolTag(name)));
  s.appendChild(el('span', 'chev', '›'));
  d.appendChild(s);
  d.appendChild(el('div', 'out'));
  d._name = name;
  d._args = undefined;
  d._result = '';
  return d;
}
// Exactly what the model sent: the command for bash, the JSON otherwise.
function toolCallText(name, args) {
  if (name === 'bash' && args && typeof args === 'object') return toolStr(args.command);
  if (typeof args === 'string') return args;
  try { return JSON.stringify(args, null, 2); } catch { return String(args); }
}
function toolResultText(res) {
  if (res == null) return '';
  if (typeof res === 'string') return toolEllipsise(res, TOOL_RESULT_MAX);
  let t = '';
  if (Array.isArray(res.content)) {
    t = res.content.map(x => (x && x.type === 'text') ? (x.text || '') : '').join('');
  } else if (typeof res.text === 'string') {
    t = res.text;
  }
  return t.length > TOOL_RESULT_MAX ? t.slice(0, TOOL_RESULT_MAX) + '…' : t;
}
function paintTool(row) {
  const out = row.querySelector('.out');
  if (!out) return;
  out.textContent = '';
  if (row._args != null) {
    const sec = el('div', 'sec');
    sec.appendChild(el('span', 'lbl', 'call'));
    sec.appendChild(el('span', 'body', toolCallText(row._name, row._args)));
    out.appendChild(sec);
  }
  if (row._result) {
    const sec = el('div', 'sec');
    sec.appendChild(el('span', 'lbl', 'result'));
    sec.appendChild(el('span', 'body', row._result));
    out.appendChild(sec);
  }
}
function setToolArgs(row, args) {
  if (args === undefined) return;
  row._args = args;
  const desc = row.querySelector('.desc');
  if (desc) desc.textContent = describeTool(row._name, args);
  paintTool(row);
}
function finishTool(row, txt, isError) {
  if (txt) row._result = txt;
  paintTool(row);
  row.classList.remove('running');
  row.classList.add(isError ? 'error' : 'done');
  if (isError) {   // §8.2: an error row carries the first line of the error
    const first = String(row._result || '').trim().split('\n')[0];
    if (first) row.querySelector('.desc').textContent = toolEllipsise(first, 100);
  }
}
function newToolRow(name, id) {
  const row = toolRow(name, id);
  if (id) toolRows.set(id, row); else unboundTools.push(row);
  return row;
}
// The row a call id owns: already registered, else the oldest row that never
// got one (toolcall_start can carry an empty id).
function bindToolRow(id, name) {
  if (id && toolRows.has(id)) return toolRows.get(id);
  if (!unboundTools.length) return null;
  let i = name ? unboundTools.findIndex(r => r._name === name) : -1;
  if (i < 0) i = 0;
  const row = unboundTools.splice(i, 1)[0];
  if (id) { row.dataset.id = id; toolRows.set(id, row); }
  if (name) { row._name = name; row.querySelector('.name').textContent = toolTag(name); }
  return row;
}
function resetToolRows() { toolRows = new Map(); unboundTools = []; }
// §8 L2: with parallel calls the old single-pointer code left earlier rows
// pulsing forever. Whatever is still running when the run ends is finished.
function settleToolRows() {
  for (const rows of [toolRows.values(), unboundTools]) {
    for (const row of rows) {
      if (!row.classList.contains('running')) continue;
      row.classList.remove('running');
      row.classList.add('done');
    }
  }
  resetToolRows();
}
// A result whose call is not on screen (old transcript, or truncated by
// MSG_SNAPSHOT) still gets a row of its own.
function standaloneResultRow(name, txt, isError) {
  const row = newToolRow(name || 'result', null);
  row.querySelector('.desc').textContent = describeTool(name, null);
  finishTool(row, txt, isError);
  return row;
}
// --- toolRows:end ---
function appendUser(t, images) {
  const m = el('div', 'msg user');
  if (t) {   // image-only sends have nothing to copy
    const cp = document.createElement('button');
    cp.type = 'button';
    cp.className = 'pcopy';
    cp.title = 'Copy prompt';
    cp._text = t;
    cp.innerHTML = copyIcons();
    m.appendChild(cp);
  }
  const b = el('div', 'bubble');
  if (t) b.appendChild(document.createTextNode(t));
  for (const im of (images || []).filter(im => im.data)) {
    const img = document.createElement('img');
    img.className = 'attach';
    img.src = 'data:' + (im.mimeType || 'image/jpeg') + ';base64,' + im.data;
    b.appendChild(img);
  }
  m.appendChild(b);
  logEl.appendChild(m);
  scrollBottom();
}
function textOf(content) {
  if (typeof content === 'string') return content;
  if (!Array.isArray(content)) return '';
  return content.filter(c => c && c.type === 'text').map(c => c.text).join('\n');
}
// ---- snapshot rendering ----
function renderSnapshot(msgs, readOnly) {
  logEl.innerHTML = '';
  resetToolRows();
  if (!msgs.length) logEl.appendChild(el('div', 'empty', 'Nothing here yet. Say hello.'));
  // §16 staleness: a choose block is only tappable on the very last message —
  // anything after it (the choice, a follow-up turn) makes it plain text.
  let lastAsst = -1;
  msgs.forEach((m, i) => { if (m.role === 'assistant') lastAsst = i; });
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    const content = m.content || [];
    if (m.role === 'user') {
      const txt = textOf(content);
      const arr = Array.isArray(content) ? content : [];
      const imgs = arr.filter(c => c && c.type === 'image')
                      .map(c => ({data: c.data, mimeType: c.mimeType || 'image/jpeg'}));
      if (txt || imgs.length) appendUser(txt, imgs);
    } else if (m.role === 'assistant') {
      const msg = el('div', 'msg assistant');
      const canChoose = !readOnly && (i === lastAsst && i === msgs.length - 1);
      for (const c of content) {
        if (c.type === 'text') {
          const b = el('div', 'bubble');
          if (!(canChoose && applyChooseBlock(b, c.text))) b.innerHTML = mdToHtml(c.text);
          b._raw = c.text;
          msg.appendChild(b);
        }
        else if (c.type === 'toolCall') {
          // §8 L3: the same row shape as the live stream, so a reloaded turn
          // and a streamed one look identical.
          const row = newToolRow(c.name, c.id);
          const args = c.arguments !== undefined ? c.arguments : c.input;
          setToolArgs(row, args);
          row.classList.remove('running');
          row.classList.add('done');
          msg.appendChild(row);
        }
      }
      if (m.stopReason === 'error') msg.appendChild(errorBubble(m.errorMessage));
      if (msg.children.length) logEl.appendChild(msg);
    } else if (m.role === 'toolResult') {
      // §8 L6: paired by toolCallId, not appended as its own "result" row.
      const txt = toolResultText({content: content});
      const row = m.toolCallId ? toolRows.get(m.toolCallId) : null;
      if (row) finishTool(row, txt, !!m.isError);
      else if (txt) logEl.appendChild(standaloneResultRow(m.toolName, txt, !!m.isError));
    }
  }
  unboundTools = [];   // nothing rendered here will ever be bound by a live event
  const lastAsstMsg = [...logEl.querySelectorAll('.msg.assistant')].pop();
  if (lastAsstMsg) addWholeCopy(lastAsstMsg);
  scrollBottom();
}

// ---- live streaming ----
function onEvent(e) {
  let ev;
  try { ev = JSON.parse(e.data); } catch { return; }
  const t = ev.type;
  if (t === 'session_deleted') {
    // Any tab: the list changed. The tab that was viewing it must not keep
    // showing a transcript that no longer exists.
    loadSessions();
    if (viewing && ev.file === viewing.file) {
      returnToLive();
      sbMsg('that session was deleted');
    }
    return;
  }
  if (t === 'session_switched') {
    loadSessions();
    refreshHeader();
    // B7: another tab resuming the transcript we are viewing read-only — this
    // tab is now looking at the live session, so leave view mode. (After an
    // un-archive, viewing.dir is stale but the basename still matches.)
    if (viewing && ev.newFile && ev.newFile.endsWith('/' + viewing.file)) {
      returnToLive();
    } else if (!viewing) {
      refreshLive();
    }
    return;
  }
  // While a past session is open, the live transcript keeps flowing but must
  // not touch the read-only view; only the status dot stays truthful.
  if (viewing && t !== 'agent_start' && t !== 'agent_settled') return;
  if (t === 'agent_start') {
    setStatus(true);
  } else if (t === 'agent_settled') {
    const finished = curBubble;
    maybeApplyChoices();   // §16: parse before resetStream eats the raw text
    setStatus(false); resetStream(); settleToolRows();
    addWholeCopy(finished);
  } else if (t === 'message_start') {
    const m = ev.message || {};
    if (m.role === 'assistant') {
      resetStream();
    } else if (m.role === 'user') {
      // Siri and Matrix share this session, so show their prompts too. Skip the
      // echo of a prompt this page already drew.
      const arr = Array.isArray(m.content) ? m.content : [];
      const txt = textOf(m.content).trim();
      const imgs = arr.filter(c => c && c.type === 'image')
                      .map(c => ({data: c.data, mimeType: c.mimeType || 'image/jpeg'}));
      const i = mine.indexOf(txt);
      if (i >= 0) mine.splice(i, 1);
      else if (txt || imgs.length) appendUser(txt, imgs);
    }
  } else if (t === 'message_end') {
    endCaret();
    const m = ev.message || {};
    if (m.role === 'assistant' && m.stopReason === 'error') {
      ensureMsg().appendChild(errorBubble(m.errorMessage));
      scrollBottom();
    }
  } else if (t === 'message_update') {
    const d = ev.assistantMessageEvent || {};
    if (d.type === 'text_delta') {
      appendDelta(d.delta); scrollBottom();
    } else if (d.type === 'toolcall_start') {
      // §8 L1/L2: rows are keyed by toolCallId from here on, so parallel calls
      // each keep their own row and their own result.
      ensureMsg().appendChild(newToolRow(d.toolName, d.id)); scrollBottom();
    } else if (d.type === 'toolcall_end') {
      const tc = d.toolCall || {};
      const row = bindToolRow(tc.id, tc.name);
      if (row) setToolArgs(row, tc.arguments);   // the row's real description
    }
  } else if (t === 'tool_execution_start') {
    const row = bindToolRow(ev.toolCallId, ev.toolName);
    if (row) setToolArgs(row, ev.args);
  } else if (t === 'tool_execution_update') {
    const row = ev.toolCallId ? toolRows.get(ev.toolCallId) : null;
    if (row) {
      const txt = toolResultText(ev.partialResult);
      if (txt) row._result = txt;
      paintTool(row);
    }
  } else if (t === 'tool_execution_end') {
    const row = bindToolRow(ev.toolCallId, ev.toolName);
    if (row) finishTool(row, toolResultText(ev.result), !!ev.isError);
  } else if (t === 'web_attachments') {
    renderAttachments(ev.files || []);
  }
}

// §15: images the agent produced this turn (already saved under its out dir
// and served by /media). Arrives after agent_settled, so it renders as its own
// assistant row rather than into the just-finalized bubble.
function renderAttachments(files) {
  const imgs = files.filter(f => /\.(png|jpe?g|webp|gif)$/i.test(f.name || ''));
  if (!imgs.length) return;
  const m = el('div', 'msg assistant');
  const row = el('div', 'atts');
  for (const f of imgs) {
    const a = document.createElement('a');
    a.href = f.url + (TOKEN ? (f.url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN) : '');
    a.target = '_blank';
    a.rel = 'noopener';
    const img = document.createElement('img');
    img.className = 'att';
    img.alt = f.name || 'attachment';
    img.src = a.href;
    a.appendChild(img);
    row.appendChild(a);
  }
  m.appendChild(row);
  logEl.appendChild(m);
  scrollBottom();
}

// ---- networking ----
function connectSSE() {
  es = new EventSource(eventsUrl);
  es.onmessage = onEvent;
  es.onopen = async () => {
    if (!firstOpen && !working && !viewing) {
      try { const msgs = await fetch('/messages', {headers:H}).then(r=>r.json()); renderSnapshot(msgs.messages || []); } catch {}
    }
    firstOpen = false;
  };
  es.onerror = () => setStatus('reconnecting…');
}

// ---- image attach ----
attachBtn.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = '';   // allow re-selecting the same photo
  if (!file) return;
  try {
    pendingImage = await shrinkImage(file);
    renderPreview();
  } catch (e) {
    appendUser('⚠ Couldn\'t read that image.');
  }
};
function renderPreview() {
  preview.innerHTML = '';
  if (!pendingImage) { preview.hidden = true; return; }
  const img = document.createElement('img');
  img.src = 'data:' + pendingImage.mimeType + ';base64,' + pendingImage.data;
  const rm = document.createElement('button');
  rm.className = 'rm'; rm.type = 'button'; rm.title = 'Remove'; rm.textContent = '✕';
  rm.onclick = () => { pendingImage = null; renderPreview(); };
  preview.appendChild(img); preview.appendChild(rm);
  preview.hidden = false;
}
// Downscale + re-encode so a 3–8 MB phone photo becomes a ~200–500 KB base64
// line over pi's stdin, with the data: prefix already stripped.
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1568;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (Math.max(w, h) > MAX) {
          const s = MAX / Math.max(w, h);
          w = Math.round(w * s); h = Math.round(h * s);
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const url = c.toDataURL('image/jpeg', 0.8);
        const m = url.match(/^data:([^;]+);base64,(.*)$/);
        if (!m) return reject(new Error('bad data url'));
        resolve({ type: 'image', data: m[2], mimeType: m[1] });
      };
      img.onerror = () => reject(new Error('decode failed'));
      img.src = fr.result;
    };
    fr.onerror = () => reject(new Error('read failed'));
    fr.readAsDataURL(file);
  });
}

// ---- controls ----
async function send() {
  let text = input.value.trim();
  const images = pendingImage ? [pendingImage] : [];
  if (!text && !images.length) return;
  if (!text && images.length) text = "What's in this image?";
  input.value = '';
  mine.push(text);
  appendUser(text, images);
  pendingImage = null;
  renderPreview();
  const body = { message: text };
  if (images.length) body.images = images;
  try {
    const r = await fetch('/prompt', {
      method:'POST',
      headers:{...H, 'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const res = await r.json().catch(() => ({}));
    if (res.error) appendUser('⚠ ' + res.error);
  } catch { setStatus('reconnecting…'); }
}
document.getElementById('compose').addEventListener('submit', e => { e.preventDefault(); send(); });
stopBtn.onclick = () => fetch('/abort', {method:'POST', headers:H}).catch(()=>{});
modelSel.onchange = () => {
  const [provider, modelId] = modelSel.value.split('|');
  fetch('/model', {
    method:'POST',
    headers:{...H, 'Content-Type':'application/json'},
    body: JSON.stringify({provider, modelId}),
  }).catch(()=>{});
};

// ---- init ----
console.info('[web-agent] dashboard ui ' + UI_VERSION);
(async function init() {
  try {
    const [st, models] = await Promise.all([
      fetch('/state', {headers:H}).then(r=>r.json()),
      fetch('/models', {headers:H}).then(r=>r.json()),
    ]);
    const list = models.models || models || [];
    const curId = st.model ? (st.model.provider + '|' + st.model.id) : null;
    for (const m of list) {
      const opt = document.createElement('option');
      opt.value = m.provider + '|' + (m.id || m.modelId);
      opt.textContent = m.id || m.modelId;
      if (opt.value === curId) opt.selected = true;
      modelSel.appendChild(opt);
    }
    sessionName.textContent = st.sessionName || st.sessionId || '';
    setStatus(st.isStreaming);
  } catch (e) { setStatus(false); }
  try {
    const msgs = await fetch('/messages', {headers:H}).then(r=>r.json());
    renderSnapshot(msgs.messages || []);
  } catch {}
  connectSSE();
  loadSessions();
  loadBuild();
})();
</script>
